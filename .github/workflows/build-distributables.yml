name: Build conda-packed distribution

# One-off (throwaway branch): this temporarily replaces the build workflow with
# a tiny job that only sets the v1.0.2+pq8 release title/notes via `gh release
# edit`. Dispatched here because a brand-new workflow file is not dispatchable
# (the workflow_dispatch trigger must be registered on the default branch), but
# this existing file IS, so the dispatched ref's version runs. This branch is
# deleted right after.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "unused"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  edit_release_notes:
    runs-on: ubuntu-latest
    steps:
      - name: Set pq8 release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Fork test build from `feat/plot-webgl-payload`. **Windows only**, unsigned (SmartScreen → **More info** → **Run anyway**). Download the `*-Windows-x86_64-installer.exe` asset below. A pip-installable `*.whl` is also attached for installing into an existing Python.

          ### Fixed
          - **Blank white tab on startup.** The WebGL reflectivity plot pulls in `typedarray-pool`, which the client's `global: {}` build shim broke (`Cannot read properties of undefined (reading 'UINT8C')`) — crashing the app before it rendered. Fixed by pointing the shim at the real browser global (`global: "window"`).

          ### Also new in this build
          - **On-page error reporting.** If the app ever fails to load, it now shows the actual error on the page (and detects browsers too old to run it, e.g. Internet Explorer) instead of a blank tab.
          - **Working self-diagnostics.** The **Refl1D Diagnostics** Start-Menu shortcut now runs directly through `python.exe` (survives script-blocking policies), writes `refl1d_diag.txt`, and opens it in Notepad.
          - **Excel-friendly parameter export.** Exporting a fit also writes `<model>-pars.csv` (plus a per-dataset table for simultaneous fits), with on-screen confirmation or a visible error if it can't be written.

          ### If it still doesn't open
          The blank tab now prints the error in red — screenshot it. Or run **Refl1D Diagnostics** from the Start Menu and send `refl1d_diag.txt`.

          See the [fork wiki](https://github.com/pquarterman17/refl1d/wiki) for install and usage.
          EOF
          gh release edit "v1.0.2+pq8" --repo "${{ github.repository }}" \
            --title "refl1d 1.0.2+pq8 — blank-tab fix (WebGL) + CSV export (fork)" \
            --notes-file notes.md --prerelease
          echo "Updated v1.0.2+pq8 release notes."
